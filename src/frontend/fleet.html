<!DOCTYPE html>
<html lang="en"><head><title>Fleet - SmartLogi AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body>
    <nav class="sidebar">
        <a href="dashboard.html" class="brand">SmartLogi AI</a>
        <div class="nav flex-column mt-3">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="fleet.html" class="nav-link active">Fleet</a>
        </div>
    </nav>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Fleet Management</h2>
    <button class="btn btn-outline-secondary" onclick="exportTableToCSV('fleet_data.csv')"><i class="fa-solid fa-download me-2"></i>Export CSV</button>
</div>
        <div class="card p-3">
            <table class="table table-hover">
                <thead><tr><th>Vehicle ID</th><th>Number</th><th>Capacity</th><th>Load</th><th>Util</th><th>Location</th><th>Action</th></tr></thead>
                <tbody>
                    <tr><td>V001</td><td>GJ01AB1234</td><td>1000 kg</td><td>800 kg</td><td>80%</td><td>Rajkot</td><td><button class="btn btn-sm btn-outline-primary">View</button></td></tr>
                    <tr><td>V002</td><td>GJ01CD5678</td><td>1500 kg</td><td>450 kg</td><td>30%</td><td>Ahmedabad</td><td><button class="btn btn-sm btn-outline-primary">View</button></td></tr>
                </tbody>
            </table>
        </div>
    </div>
<script>
    function exportTableToCSV(filename) {
        var csv = [];
        var rows = document.querySelectorAll("table tr");
        for (var i = 0; i < rows.length; i++) {
            var row = [], cols = rows[i].querySelectorAll("td, th");
            for (var j = 0; j < cols.length; j++) row.push(cols[j].innerText);
            csv.push(row.join(","));
        }
        var csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
        var downloadLink = document.createElement("a");
        downloadLink.download = filename;
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
    }
</script>
</body>
