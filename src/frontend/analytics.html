<!DOCTYPE html>
<html lang="en"><head><title>Analytics - SmartLogi AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body>
    <nav class="sidebar"><a href="dashboard.html" class="brand">SmartLogi AI</a><div class="nav flex-column mt-3"><a href="dashboard.html" class="nav-link">Dashboard</a><a href="analytics.html" class="nav-link active">Analytics</a></div></nav>
    <div class="main-content">
        <h2 class="mb-4 fw-bold">Analytics & Fleet Forecasting</h2>
        <div class="row">
            <div class="col-md-6"><div class="card p-3"><canvas id="c1"></canvas></div></div>
            <div class="col-md-6"><div class="card p-3"><canvas id="c2"></canvas></div></div>
        </div>
    </div>
    <script>
        new Chart(document.getElementById('c1'), { type: 'pie', data: { labels: ['Delivered', 'Transit', 'Delayed', 'Pending'], datasets: [{ data: [60, 20, 15, 5], backgroundColor: ['#198038', '#0f62fe', '#da1e28', '#f1c21b'] }] } });
        new Chart(document.getElementById('c2'), { type: 'bar', data: { labels: ['V001', 'V002', 'V003', 'V004'], datasets: [{ label: 'Risk Distribution', data: [80, 20, 45, 15], backgroundColor: '#8a3ffc' }] } });
    </script>
</body></html>
