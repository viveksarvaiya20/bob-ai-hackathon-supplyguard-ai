<!DOCTYPE html>
<html lang="en"><head><title>Shipments - SmartLogi AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body>
    <nav class="sidebar">
        <a href="dashboard.html" class="brand">SmartLogi AI</a>
        <div class="nav flex-column mt-3"><a href="dashboard.html" class="nav-link">Dashboard</a><a href="shipments.html" class="nav-link active">Shipments</a></div>
    </nav>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Shipment Management</h2>
    <button class="btn btn-outline-secondary" onclick="exportTableToCSV('shipments_data.csv')"><i class="fa-solid fa-download me-2"></i>Export CSV</button>
</div>
        <div class="card p-3">
            <table class="table table-hover">
                <thead><tr><th>ID</th><th>Origin</th><th>Dest</th><th>Priority</th><th>Vehicle</th><th>Risk</th><th>Action</th></tr></thead>
                <tbody>
                    <tr><td>S102</td><td>Rajkot</td><td>Ahmedabad</td><td>High</td><td>V001</td><td><span class="badge bg-high">72% LOW</span></td><td><a href="shipment-details.html" class="btn btn-sm btn-outline-primary">Analyze</a></td></tr>
                </tbody>
            </table>
        </div>
    </div>
<script>
    function exportTableToCSV(filename) {
        var csv = [];
        var rows = document.querySelectorAll("table tr");
        for (var i = 0; i < rows.length; i++) {
            var row = [], cols = rows[i].querySelectorAll("td, th");
            for (var j = 0; j < cols.length; j++) row.push(cols[j].innerText);
            csv.push(row.join(","));
        }
        var csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
        var downloadLink = document.createElement("a");
        downloadLink.download = filename;
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
    }
</script>
</body>
